# Publishes the Roohsites Appointment Booking sales site (external/booking-site, a copy of site/ from the private
# slotsmith repo) to the Cloudflare Pages project that serves booking.roohsites.com, or to rooh-booking (created if
# needed, and the domain attached to it through the API when the token allows). Once booking.roohsites.com serves
# this deploy, the old address slotsmith.roohsites.com gets external/slotsmith-redirect (a 301 to the new site).
# Not in sites.json on purpose: it isn't one of the free tools, so it stays out of the footers, hub, pins and IndexNow.
# Same secrets as deploy-cf.yml. See docs/cloudflare.md.
name: Deploy booking site

on:
  push:
    branches: [claude/ecstatic-pascal-yzcrhr]
    paths: ["external/booking-site/**", "external/slotsmith-redirect/**", "tools/cf-pages-project.mjs", ".github/workflows/deploy-booking.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-booking
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  DOMAIN: booking.roohsites.com
  OLD_DOMAIN: slotsmith.roohsites.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find the Pages project for the domain
        id: project
        run: node tools/cf-pages-project.mjs "$DOMAIN" rooh-booking

      - name: Deploy
        env:
          PROJECT: ${{ steps.project.outputs.name }}
          BRANCH: ${{ steps.project.outputs.branch }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/booking-site"
          mkdir -p "$out"
          cp -r external/booking-site/. "$out/"
          # Keep the *.pages.dev copies out of search engines; the custom domain is the real site.
          printf 'https://:project.pages.dev/*\n  X-Robots-Tag: noindex\nhttps://:version.:project.pages.dev/*\n  X-Robots-Tag: noindex\n' > "$out/_headers"
          # Lets the check below tell this deploy apart from whatever was live before.
          echo "$GITHUB_SHA" > "$out/version.txt"
          # A new project needs creating once; an existing one is fine.
          if ! msg=$(npx --yes wrangler@4 pages project create "$PROJECT" --production-branch="$BRANCH" 2>&1); then
            grep -qi "already exists" <<<"$msg" || { echo "$msg"; exit 1; }
          fi
          npx --yes wrangler@4 pages deploy "$out" --project-name="$PROJECT" --branch="$BRANCH" --commit-dirty=true

      - name: Attach the domain (first deploy only)
        if: steps.project.outputs.attached != 'true'
        env:
          PROJECT: ${{ steps.project.outputs.name }}
        run: |
          set -uo pipefail
          res=$(curl -s -m 30 -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
            -d "{\"name\":\"$DOMAIN\"}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains")
          echo "$res" | head -c 600; echo
          if echo "$res" | grep -qE '"success": *true'; then
            echo "Added $DOMAIN to $PROJECT. Cloudflare sets up the DNS record and certificate; that can take a few minutes."
            { echo; echo "Added **$DOMAIN** to **$PROJECT** (DNS and certificate can take a few minutes)."; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Add the domain by hand::Could not add $DOMAIN to $PROJECT through the API. In Cloudflare: Workers & Pages > $PROJECT > Custom domains > Set up a domain > $DOMAIN."
            { echo; echo "Add **$DOMAIN** by hand: Workers & Pages > **$PROJECT** > Custom domains."; } >> "$GITHUB_STEP_SUMMARY"
          fi
          # Give DNS a moment before the live check below.
          sleep 60

      - name: Domain status and DNS record
        env:
          PROJECT: ${{ steps.project.outputs.name }}
        run: |
          set -uo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          d=$(curl -s -m 30 "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains/$DOMAIN")
          echo "$d" | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{try{const r=JSON.parse(s).result||{};console.log("domain status:",r.status,"| validation:",JSON.stringify(r.validation_data),"| verification:",JSON.stringify(r.verification_data))}catch(e){console.log(s.slice(0,400))}})'
          zone=$(echo "$d" | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{try{process.stdout.write((JSON.parse(s).result||{}).zone_tag||"")}catch(e){}})')
          echo "$d" | grep -qE '"status": *"active"' && { echo "$DOMAIN is active on $PROJECT."; exit 0; }
          [ -n "$zone" ] || { echo "No zone for $DOMAIN in this account."; exit 0; }
          host=${DOMAIN%%.*}
          have=$(curl -s -m 30 "${auth[@]}" "$api/zones/$zone/dns_records?name=$DOMAIN")
          if echo "$have" | grep -qE '"count": *[1-9]'; then
            echo "DNS record for $DOMAIN exists:"; echo "$have" | grep -oE '"(type|content|proxied)": *[^,]*' | head -6
          else
            r=$(curl -s -m 30 -X POST "${auth[@]}" -d "{\"type\":\"CNAME\",\"name\":\"$host\",\"content\":\"$PROJECT.pages.dev\",\"proxied\":true}" "$api/zones/$zone/dns_records")
            if echo "$r" | grep -qE '"success": *true'; then
              echo "Created CNAME $DOMAIN -> $PROJECT.pages.dev (proxied)."; { echo; echo "Created DNS record **$DOMAIN → $PROJECT.pages.dev**."; } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$r" | head -c 500; echo
              echo "::warning title=Add the DNS record by hand::In Cloudflare DNS for roohsites.com add CNAME $host -> $PROJECT.pages.dev (proxied)."
              { echo; echo "Add DNS by hand: CNAME **$host → $PROJECT.pages.dev** (proxied)."; } >> "$GITHUB_STEP_SUMMARY"
            fi
            sleep 45
          fi

      - name: Check the live site
        env:
          PROJECT: ${{ steps.project.outputs.name }}
        run: |
          set -uo pipefail
          live() { curl -fsS -m 20 "https://$1/version.txt?v=$GITHUB_SHA" 2>/dev/null | tr -d '[:space:]'; }
          for try in 1 2 3 4 5 6; do [ "$(live "$PROJECT.pages.dev")" = "$GITHUB_SHA" ] && break; sleep 10; done
          table=$'| page | '"$PROJECT"$'.pages.dev | '"$DOMAIN"$' |\n|---|---|---|'
          for f in external/booking-site/*.html; do
            p=$(basename "$f" .html); [ "$p" = 404 ] && continue; [ "$p" = index ] && p=""
            a=$(curl -s -o /dev/null -w '%{http_code}' -L -m 20 "https://$PROJECT.pages.dev/$p" || true)
            b=$(curl -s -o /dev/null -w '%{http_code}' -L -m 20 "https://$DOMAIN/$p" || true)
            table+=$'\n'"| /$p | $a | $b |"
          done
          echo "$table"
          { echo "### Booking site"; echo; echo "$table"; } >> "$GITHUB_STEP_SUMMARY"
          # Icons Google can use, and a real 404 for unknown addresses (no 404.html makes Pages answer 200 with the home page).
          for f in /favicon.ico /favicon.svg /apple-touch-icon.png; do
            line=$( { curl -sIL -m 20 "https://$DOMAIN$f" || true; } | tr -d '\r' | { grep -iE '^(HTTP|content-type)' || true; } | tr '\n' ' ')
            echo "$f: $line"; echo "- $f: $line" >> "$GITHUB_STEP_SUMMARY"
          done
          nf=$(curl -s -o /dev/null -m 20 -w '%{http_code}' "https://$DOMAIN/this-page-does-not-exist-$GITHUB_RUN_ID" || true)
          echo "unknown address answers HTTP $nf"; echo "- unknown address: HTTP $nf" >> "$GITHUB_STEP_SUMMARY"
          [ "$nf" = 404 ] || echo "::warning title=Soft 404::$DOMAIN answers $nf for an unknown address; it should be 404."
          [ "$(live "$PROJECT.pages.dev")" = "$GITHUB_SHA" ] || { echo "::error::$PROJECT.pages.dev isn't serving this deploy."; exit 1; }
          if [ "$(live "$DOMAIN")" = "$GITHUB_SHA" ]; then
            echo "$DOMAIN is serving this deploy."
          else
            echo "::warning title=Domain not moved yet::$DOMAIN still serves something else. In Cloudflare, remove the domain from the Worker or project it is on now, then add it under Workers & Pages > $PROJECT > Custom domains."
            echo "**$DOMAIN** still serves an older copy: move the domain to **$PROJECT** (Custom domains)." >> "$GITHUB_STEP_SUMMARY"
          fi
          # http:// should redirect to https:// (Cloudflare: SSL/TLS > Edge Certificates > Always Use HTTPS).
          read -r code to < <(curl -s -o /dev/null -m 20 -w '%{http_code} %{redirect_url}\n' "http://$DOMAIN/compare" || true) || true
          if [[ "$code" =~ ^30[178]$ && "$to" == "https://$DOMAIN/compare" ]]; then
            echo "http://$DOMAIN redirects to https ($code)."
            { echo; echo "http → https: $code"; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=No https redirect::http://$DOMAIN/compare answered $code ${to:-without a redirect}. Turn on Always Use HTTPS in Cloudflare (SSL/TLS > Edge Certificates)."
            { echo; echo "http → https: **not redirecting** ($code)"; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Redirect the old address (slotsmith.roohsites.com)
        run: |
          set -uo pipefail
          # Only once the new domain serves this deploy, so the old address never points at a dead site.
          if [ "$(curl -fsS -m 20 "https://$DOMAIN/version.txt?v=$GITHUB_SHA" 2>/dev/null | tr -d '[:space:]')" != "$GITHUB_SHA" ]; then
            echo "::warning title=Old address not redirected yet::$DOMAIN isn't live yet, so $OLD_DOMAIN keeps the old site for now. Run this workflow again once $DOMAIN works."
            { echo; echo "Old address: **not redirected yet** ($DOMAIN isn't live)."; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          old=$(node tools/cf-pages-project.mjs "$OLD_DOMAIN" 2>/dev/null | sed -n 's/^.* is served by \([^ ]*\) (production branch \([^)]*\))$/\1 \2/p')
          if [ -z "$old" ]; then echo "No Pages project serves $OLD_DOMAIN; nothing to redirect."; exit 0; fi
          read -r oproj obranch <<<"$old"
          npx --yes wrangler@4 pages deploy external/slotsmith-redirect --project-name="$oproj" --branch="$obranch" --commit-dirty=true
          sleep 15
          read -r code to < <(curl -s -o /dev/null -m 20 -w '%{http_code} %{redirect_url}\n' "https://$OLD_DOMAIN/compare" || true) || true
          echo "https://$OLD_DOMAIN/compare answers $code -> $to"
          { echo; echo "Old address: https://$OLD_DOMAIN/compare → $code $to"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Tell search engines (IndexNow)
        run: |
          set -uo pipefail
          keyfile=$(ls external/booking-site/ | grep -E '^[0-9a-f]{32}\.txt$' | head -1 || true)
          [ -n "$keyfile" ] || { echo "No IndexNow key file; skipping."; exit 0; }
          key=${keyfile%.txt}
          # IndexNow fetches the key from the live domain, so only ping once it serves this deploy.
          if [ "$(curl -fsS -m 20 "https://$DOMAIN/$keyfile" 2>/dev/null | tr -d '[:space:]')" != "$key" ]; then
            echo "::warning::The IndexNow key isn't live on $DOMAIN yet; skipped."; exit 0
          fi
          urls=$(grep -o '<loc>[^<]*</loc>' external/booking-site/sitemap.xml | sed 's/<[^>]*>//g' | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>process.stdout.write(JSON.stringify(d.trim().split("\n"))))')
          body=$(printf '{"host":"%s","key":"%s","keyLocation":"https://%s/%s","urlList":%s}' "$DOMAIN" "$key" "$DOMAIN" "$keyfile" "$urls")
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 -H 'Content-Type: application/json; charset=utf-8' -d "$body" https://api.indexnow.org/indexnow)
          echo "IndexNow answered HTTP $code for $(grep -c '<loc>' external/booking-site/sitemap.xml) URLs (200 or 202 means accepted)."
          { echo; echo "IndexNow: HTTP $code"; } >> "$GITHUB_STEP_SUMMARY"
