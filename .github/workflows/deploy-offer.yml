# Publishes the redesigned launch offer (external/offer-site, built by engine/build_offer_v2.py in the private roohsites repo) to
# offer.roohsites.com for review, before it replaces roohsites.com/launch-offer/. The whole site is noindex (meta, robots.txt, _headers).
# Same steps and secrets as deploy-booking.yml: find or create the Pages project, deploy, attach the domain, check DNS, check the live page.
name: Deploy offer review site

on:
  push:
    branches: [claude/ecstatic-pascal-yzcrhr]
    paths: ["external/offer-site/**", ".github/workflows/deploy-offer.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-offer
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  DOMAIN: offer.roohsites.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find the Pages project for the domain
        id: project
        run: node tools/cf-pages-project.mjs "$DOMAIN" rooh-offer

      - name: Deploy
        env:
          PROJECT: ${{ steps.project.outputs.name }}
          BRANCH: ${{ steps.project.outputs.branch }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/offer-site"
          mkdir -p "$out"
          cp -r external/offer-site/. "$out/"
          echo "$GITHUB_SHA" > "$out/version.txt"
          if ! msg=$(npx --yes wrangler@4 pages project create "$PROJECT" --production-branch="$BRANCH" 2>&1); then
            grep -qi "already exists" <<<"$msg" || { echo "$msg"; exit 1; }
          fi
          npx --yes wrangler@4 pages deploy "$out" --project-name="$PROJECT" --branch="$BRANCH" --commit-dirty=true

      - name: Attach the domain (first deploy only)
        if: steps.project.outputs.attached != 'true'
        env:
          PROJECT: ${{ steps.project.outputs.name }}
        run: |
          set -uo pipefail
          res=$(curl -s -m 30 -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
            -d "{\"name\":\"$DOMAIN\"}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains")
          echo "$res" | head -c 600; echo
          if echo "$res" | grep -qE '"success": *true'; then
            { echo; echo "Added **$DOMAIN** to **$PROJECT** (DNS and certificate can take a few minutes)."; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Add the domain by hand::In Cloudflare: Workers & Pages > $PROJECT > Custom domains > Set up a domain > $DOMAIN."
            { echo; echo "Add **$DOMAIN** by hand: Workers & Pages > **$PROJECT** > Custom domains."; } >> "$GITHUB_STEP_SUMMARY"
          fi
          sleep 60

      - name: Domain status and DNS record
        env:
          PROJECT: ${{ steps.project.outputs.name }}
        run: |
          set -uo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          d=$(curl -s -m 30 "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains/$DOMAIN")
          echo "$d" | head -c 500; echo
          echo "$d" | grep -qE '"status": *"active"' && { echo "$DOMAIN is active on $PROJECT."; exit 0; }
          zone=$(echo "$d" | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{try{process.stdout.write((JSON.parse(s).result||{}).zone_tag||"")}catch(e){}})')
          [ -n "$zone" ] || { echo "No zone for $DOMAIN in this account."; exit 0; }
          have=$(curl -s -m 30 "${auth[@]}" "$api/zones/$zone/dns_records?name=$DOMAIN")
          if echo "$have" | grep -qE '"count": *[1-9]'; then
            echo "DNS record for $DOMAIN exists."
          else
            r=$(curl -s -m 30 -X POST "${auth[@]}" -d "{\"type\":\"CNAME\",\"name\":\"offer\",\"content\":\"$PROJECT.pages.dev\",\"proxied\":true}" "$api/zones/$zone/dns_records")
            if echo "$r" | grep -qE '"success": *true'; then
              { echo; echo "Created DNS record **$DOMAIN → $PROJECT.pages.dev**."; } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$r" | head -c 400; echo
              echo "::warning title=Add the DNS record by hand::In Cloudflare DNS for roohsites.com add CNAME offer -> $PROJECT.pages.dev (proxied)."
              { echo; echo "Add DNS by hand: CNAME **offer → $PROJECT.pages.dev** (proxied)."; } >> "$GITHUB_STEP_SUMMARY"
            fi
            sleep 45
          fi

      - name: Check the live site
        env:
          PROJECT: ${{ steps.project.outputs.name }}
        run: |
          set -uo pipefail
          live() { curl -fsS -m 20 "https://$1/version.txt?v=$GITHUB_SHA" 2>/dev/null | tr -d '[:space:]'; }
          for try in 1 2 3 4 5 6; do [ "$(live "$PROJECT.pages.dev")" = "$GITHUB_SHA" ] && break; sleep 10; done
          for host in "$PROJECT.pages.dev" "$DOMAIN"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L -m 20 "https://$host/" || true)
            vid=$(curl -s -o /dev/null -w '%{http_code}' -m 20 "https://$host/media/booking-demo.mp4" || true)
            echo "$host: page $code, video $vid"; echo "- $host: page $code, video $vid" >> "$GITHUB_STEP_SUMMARY"
          done
          [ "$(live "$PROJECT.pages.dev")" = "$GITHUB_SHA" ] || { echo "::error::$PROJECT.pages.dev isn't serving this deploy."; exit 1; }
          if [ "$(live "$DOMAIN")" = "$GITHUB_SHA" ]; then echo "$DOMAIN is serving this deploy."
          else echo "::warning title=Domain not live yet::$DOMAIN doesn't serve this deploy yet (DNS or certificate still pending, or the domain needs adding by hand)."; fi
