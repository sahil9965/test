# Publishes the Slotsmith sales site (external/slotsmith-site, a copy of site/ from the private slotsmith repo)
# to the Cloudflare Pages project that serves slotsmith.roohsites.com, or to rooh-slotsmith (created if needed)
# until the domain is added to a project in this account. Not in sites.json on purpose:
# it isn't one of the free tools, so it stays out of the footers, hub, pins and IndexNow.
# Same secrets as deploy-cf.yml. See docs/cloudflare.md.
name: Deploy Slotsmith site

on:
  push:
    branches: [claude/ecstatic-pascal-yzcrhr]
    paths: ["external/slotsmith-site/**", "tools/cf-pages-project.mjs", ".github/workflows/deploy-slotsmith.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-slotsmith
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  DOMAIN: slotsmith.roohsites.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find the Pages project for the domain
        id: project
        run: node tools/cf-pages-project.mjs "$DOMAIN" rooh-slotsmith

      - name: Deploy
        env:
          PROJECT: ${{ steps.project.outputs.name }}
          BRANCH: ${{ steps.project.outputs.branch }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/slotsmith-site"
          mkdir -p "$out"
          cp -r external/slotsmith-site/. "$out/"
          # Keep the *.pages.dev copies out of search engines; the custom domain is the real site.
          printf 'https://:project.pages.dev/*\n  X-Robots-Tag: noindex\nhttps://:version.:project.pages.dev/*\n  X-Robots-Tag: noindex\n' > "$out/_headers"
          # Lets the check below tell this deploy apart from whatever was live before.
          echo "$GITHUB_SHA" > "$out/version.txt"
          # A new project needs creating once; an existing one is fine.
          if ! msg=$(npx --yes wrangler@4 pages project create "$PROJECT" --production-branch="$BRANCH" 2>&1); then
            grep -qi "already exists" <<<"$msg" || { echo "$msg"; exit 1; }
          fi
          npx --yes wrangler@4 pages deploy "$out" --project-name="$PROJECT" --branch="$BRANCH" --commit-dirty=true

      - name: Check the live site
        env:
          PROJECT: ${{ steps.project.outputs.name }}
        run: |
          set -uo pipefail
          live() { curl -fsS -m 20 "https://$1/version.txt?v=$GITHUB_SHA" 2>/dev/null | tr -d '[:space:]'; }
          for try in 1 2 3 4 5 6; do [ "$(live "$PROJECT.pages.dev")" = "$GITHUB_SHA" ] && break; sleep 10; done
          table=$'| page | '"$PROJECT"$'.pages.dev | '"$DOMAIN"$' |\n|---|---|---|'
          for f in external/slotsmith-site/*.html; do
            p=$(basename "$f" .html); [ "$p" = index ] && p=""
            a=$(curl -s -o /dev/null -w '%{http_code}' -L -m 20 "https://$PROJECT.pages.dev/$p")
            b=$(curl -s -o /dev/null -w '%{http_code}' -L -m 20 "https://$DOMAIN/$p")
            table+=$'\n'"| /$p | $a | $b |"
          done
          echo "$table"
          { echo "### Slotsmith site"; echo; echo "$table"; } >> "$GITHUB_STEP_SUMMARY"
          [ "$(live "$PROJECT.pages.dev")" = "$GITHUB_SHA" ] || { echo "::error::$PROJECT.pages.dev isn't serving this deploy."; exit 1; }
          if [ "$(live "$DOMAIN")" = "$GITHUB_SHA" ]; then
            echo "$DOMAIN is serving this deploy."
          else
            echo "::warning title=Domain not moved yet::$DOMAIN still serves something else. In Cloudflare, remove the domain from the Worker or project it is on now, then add it under Workers & Pages > $PROJECT > Custom domains."
            echo "**$DOMAIN** still serves an older copy: move the domain to **$PROJECT** (Custom domains)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Tell search engines (IndexNow)
        run: |
          set -uo pipefail
          keyfile=$(ls external/slotsmith-site/ | grep -E '^[0-9a-f]{32}\.txt$' | head -1 || true)
          [ -n "$keyfile" ] || { echo "No IndexNow key file; skipping."; exit 0; }
          key=${keyfile%.txt}
          # IndexNow fetches the key from the live domain, so only ping once it serves this deploy.
          if [ "$(curl -fsS -m 20 "https://$DOMAIN/$keyfile" 2>/dev/null | tr -d '[:space:]')" != "$key" ]; then
            echo "::warning::The IndexNow key isn't live on $DOMAIN yet; skipped."; exit 0
          fi
          urls=$(grep -o '<loc>[^<]*</loc>' external/slotsmith-site/sitemap.xml | sed 's/<[^>]*>//g' | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>process.stdout.write(JSON.stringify(d.trim().split("\n"))))')
          body=$(printf '{"host":"%s","key":"%s","keyLocation":"https://%s/%s","urlList":%s}' "$DOMAIN" "$key" "$DOMAIN" "$keyfile" "$urls")
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 -H 'Content-Type: application/json; charset=utf-8' -d "$body" https://api.indexnow.org/indexnow)
          echo "IndexNow answered HTTP $code for $(grep -c '<loc>' external/slotsmith-site/sitemap.xml) URLs (200 or 202 means accepted)."
          { echo; echo "IndexNow: HTTP $code"; } >> "$GITHUB_STEP_SUMMARY"
