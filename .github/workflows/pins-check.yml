# Live check of the Pinterest schedule (tools/pins-check.mjs): every image and link in https://tools.roohsites.com/pins/schedule.json.
# Runs after each push that changes the pins (it waits for the deploy to put the new schedule live, then checks it).
name: pins-check
on:
  push:
    branches: [claude/ecstatic-pascal-yzcrhr]
    paths: ['sites/hub/pins/**', 'tools/pins-check.mjs', '.github/workflows/pins-check.yml']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/pins-check.mjs
