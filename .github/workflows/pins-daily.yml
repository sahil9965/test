# Every morning: add the day's automatic Pinterest pins (tools/pins-auto.mjs, 3 a day), publish them on tools.roohsites.com and check
# the live schedule (tools/pins-check.mjs). When fewer than 30 days of pins are left it opens a GitHub issue (GitHub emails you). The Cowork posting task picks them up from schedule.json, so posting never runs dry.
# A push made by this job does not start other workflows, so it deploys the hub site itself (the same commands as deploy-cf.yml).
# Scheduled runs only start from the repository's default branch: it must be claude/ecstatic-pascal-yzcrhr (Settings > General).
name: pins-daily

on:
  schedule:
    - cron: '23 2 * * *'          # 02:23 UTC = 7:53 AM India, before the first US posting run
    - cron: '47 13 * * *'         # 13:47 UTC = 7:17 PM India: a second chance if GitHub skipped the morning run (adds nothing if it worked)
  workflow_dispatch:
    inputs:
      count:
        description: How many pins to add (empty = top today up to per_day in tools/pins-auto.json)
        default: ''

permissions:
  contents: write
  issues: write

concurrency:
  group: deploy-cf
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  pins:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/ecstatic-pascal-yzcrhr

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the browser that draws the pins
        run: cd tools && npm ci && npx playwright install --with-deps chromium

      - name: Add the day's pins
        id: add
        run: node tools/pins-auto.mjs ${{ inputs.count }}

      - name: Warn when fewer than 30 days of pins are left
        if: steps.add.outputs.days != '' && fromJSON(steps.add.outputs.days) < 30
        env:
          GH_TOKEN: ${{ github.token }}
          LEFT: ${{ steps.add.outputs.left }}
          DAYS: ${{ steps.add.outputs.days }}
        run: |
          title="Pinterest pins running low: about $DAYS days left"
          if gh issue list --state open --search "Pinterest pins running low in:title" --json number --jq 'length' | grep -qx 0; then
            gh issue create --title "$title" --body "The daily pin robot can make only $LEFT more pins (about $DAYS days at 3 a day). Ask Claude Code to add pages or pins so Pinterest posting doesn't stop."
          fi

      - name: Commit and push
        id: commit
        run: |
          git add -A sites/hub/pins tools/pins-auto.json marketing/pinterest-pins.csv marketing/pinterest-posts.md
          if git diff --cached --quiet; then echo "Nothing new."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git -c user.name="rooh-robot" -c user.email="robot@roohsites.com" commit -q -m "pins: add the day's Pinterest pins"
          git pull -q --rebase origin claude/ecstatic-pascal-yzcrhr
          git push -q origin HEAD:claude/ecstatic-pascal-yzcrhr
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy tools.roohsites.com
        if: steps.commit.outputs.changed == 'true'
        run: |
          node tools/cf-build.mjs hub
          (cd dist/hub && npx --yes wrangler@4 pages deploy public --project-name=rooh-hub --branch=main --commit-dirty=true)

      - name: Check the live schedule
        if: steps.commit.outputs.changed == 'true'
        run: node tools/pins-check.mjs
