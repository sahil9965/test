<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>InvoiceKit — Create Invoice</title>
<meta name="description" content="Free online invoice maker. Fill in, preview and download a PDF invoice. No signup.">
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
<script src="/config.js"></script>
<style>
.app{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:20px;padding-bottom:40px}
@media(max-width:900px){.app{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel h4{margin:16px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.panel h4:first-child{margin-top:0}
label{display:block;font-size:13px;color:var(--muted);margin:6px 0 2px}
input,textarea,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;font-size:14px}
textarea{resize:vertical;min-height:58px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{display:grid;grid-template-columns:1fr 54px 80px 28px;gap:6px;margin-bottom:6px}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pro-tag{font-size:11px;background:var(--accent);color:var(--accent-fg);border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.locked{opacity:.55}
/* Invoice paper is always light */
#paper{background:#fff;color:#1b1b1f;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.12);padding:48px;min-height:900px;font-size:14px;position:relative}
#paper table{width:100%;border-collapse:collapse;margin:28px 0}
#paper th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#6b6b76;border-bottom:2px solid #1b1b1f;padding:8px 6px}
#paper td{padding:10px 6px;border-bottom:1px solid #eee;vertical-align:top}
#paper .r{text-align:right}
.p-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
.p-title{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0}
.p-logo{max-height:64px;max-width:200px}
.p-meta{color:#6b6b76;line-height:1.7}
.p-parties{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:32px;white-space:pre-line}
.p-label{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#6b6b76;margin-bottom:4px}
.p-totals{margin-left:auto;width:280px}
.p-totals div{display:flex;justify-content:space-between;padding:4px 0}
.p-totals .grand{border-top:2px solid #1b1b1f;margin-top:6px;padding-top:10px;font-size:18px;font-weight:700}
.p-notes{margin-top:36px;white-space:pre-line;color:#444}
.p-wm{position:absolute;bottom:20px;left:0;right:0;text-align:center;font-size:11px;color:#9a9aa6}
/* templates */
#paper.t-modern .p-head{background:#2f5bea;color:#fff;margin:-48px -48px 0;padding:36px 48px;border-radius:6px 6px 0 0}
#paper.t-modern .p-meta{color:#dfe6ff}
#paper.t-modern th{border-bottom-color:#2f5bea;color:#2f5bea}
#paper.t-minimal{font-family:Georgia,serif}
#paper.t-minimal th{border-bottom:1px solid #ccc}
#paper.t-minimal .p-title{font-weight:400;font-size:28px;letter-spacing:.2em;text-transform:uppercase}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);max-width:420px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.4)}
@media print{
  @page{margin:0}
  body{background:#fff}
  header.top,.panel,.toolbar,dialog{display:none!important}
  .wrap{max-width:none;padding:0}
  .app{display:block}
  #paper{box-shadow:none;border-radius:0;min-height:100vh}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="logo" href="/">Invoice<span>Kit</span></a>
    <nav><span id="status" style="color:var(--muted);font-size:14px"></span> <button class="btn sm" id="proBtn">Activate Pro</button></nav>
  </header>

  <div class="toolbar">
    <button class="btn" id="pdf">Download PDF</button>
    <button class="btn ghost" id="new">New invoice</button>
    <button class="btn ghost" id="dup">Duplicate<span class="pro-tag">PRO</span></button>
    <select id="history" style="width:auto"><option value="">History (Pro)</option></select>
  </div>

  <div class="app">
    <form class="panel" id="f" autocomplete="off">
      <h4>Your business</h4>
      <label>Logo <span class="pro-tag">PRO</span></label><input type="file" id="logo" accept="image/*">
      <label>From</label><textarea name="from" placeholder="Your name / company&#10;Address&#10;email@example.com"></textarea>

      <h4>Bill to</h4>
      <label>Saved clients <span class="pro-tag">PRO</span></label>
      <div class="row"><select id="clients"><option value="">— select —</option></select><button type="button" class="btn ghost sm" id="saveClient">Save client</button></div>
      <label>Client</label><textarea name="to" placeholder="Client name&#10;Address"></textarea>

      <h4>Details</h4>
      <div class="row">
        <div><label>Invoice #</label><input name="number"></div>
        <div><label>Currency</label><select name="currency"></select></div>
      </div>
      <div class="row">
        <div><label>Issue date</label><input type="date" name="date"></div>
        <div><label>Due date</label><input type="date" name="due"></div>
      </div>
      <label>Template <span class="pro-tag">PRO</span></label>
      <select name="template"><option value="classic">Classic</option><option value="modern">Modern</option><option value="minimal">Minimal</option></select>

      <h4>Items</h4>
      <div class="item" style="font-size:12px;color:var(--muted)"><span>Description</span><span>Qty</span><span>Rate</span><span></span></div>
      <div id="items"></div>
      <button type="button" class="btn ghost sm" id="addItem">+ Add item</button>

      <div class="row" style="margin-top:8px">
        <div><label>Tax %</label><input type="number" step="any" name="tax" value="0"></div>
        <div><label>Discount %</label><input type="number" step="any" name="discount" value="0"></div>
      </div>

      <h4>Notes &amp; payment</h4>
      <textarea name="notes" placeholder="Payment details (bank / PayPal), terms, thank-you note"></textarea>
    </form>

    <div><div id="paper"></div></div>
  </div>
</div>

<dialog id="dlg">
  <h3 style="margin-top:0">Unlock InvoiceKit Pro</h3>
  <p style="color:var(--muted)">Logo, no watermark, saved clients, history and premium templates. <b><span class="js-price"></span> once</b>, yours forever.</p>
  <a class="btn js-buy" target="_blank" rel="noopener" href="#" style="width:100%;text-align:center">Buy Pro</a>
  <label style="margin-top:16px">Already bought? Paste your license key</label>
  <input id="key" placeholder="XXXXXXXX-XXXXXXXX-XXXXXXXX-XXXXXXXX">
  <p id="keyMsg" style="font-size:14px;min-height:20px"></p>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn ghost sm" id="close">Close</button><button class="btn sm" id="activate">Activate</button></div>
</dialog>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const store = {
    get(k, d) { try { const v = localStorage.getItem("ik_" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem("ik_" + k, JSON.stringify(v)); } catch {} },
  };
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const today = (d = 0) => { const t = new Date(Date.now() + d * 864e5); return t.toISOString().slice(0, 10); };
  const CUR = ["USD","EUR","GBP","INR","CAD","AUD","JPY","CHF","SGD","AED","BRL","MXN","ZAR","NZD","SEK","PLN"];

  let pro = store.get("pro", false);
  const f = $("#f");
  CUR.forEach(c => f.currency.add(new Option(c, c)));

  const blank = () => ({
    from: store.get("from", ""), to: "", number: nextNumber(), currency: store.get("currency", "USD"),
    date: today(), due: today(14), template: "classic", tax: 0, discount: 0, notes: store.get("notes", ""),
    items: [{ d: "", q: 1, r: 0 }],
  });
  function nextNumber() { const n = store.get("seq", 0) + 1; return "INV-" + String(n).padStart(4, "0"); }

  let inv = store.get("draft", null) || blank();

  function load(v) {
    inv = structuredClone(v);
    for (const k of ["from","to","number","currency","date","due","template","tax","discount","notes"]) f[k].value = inv[k] ?? "";
    renderItems(); render();
  }
  function renderItems() {
    $("#items").innerHTML = inv.items.map((it, i) =>
      `<div class="item" data-i="${i}"><input data-k="d" value="${esc(it.d)}" placeholder="Service or product"><input data-k="q" type="number" step="any" value="${it.q}"><input data-k="r" type="number" step="any" value="${it.r}"><button type="button" class="x" title="Remove">×</button></div>`).join("");
  }
  const money = n => { try { return new Intl.NumberFormat(undefined, { style: "currency", currency: inv.currency }).format(n); } catch { return n.toFixed(2); } };

  function render() {
    const sub = inv.items.reduce((s, it) => s + (+it.q || 0) * (+it.r || 0), 0);
    const disc = sub * (+inv.discount || 0) / 100;
    const tax = (sub - disc) * (+inv.tax || 0) / 100;
    const total = sub - disc + tax;
    const logo = pro && store.get("logo", "");
    const p = $("#paper");
    p.className = "t-" + (pro ? inv.template : "classic");
    p.innerHTML = `
      <div class="p-head">
        <div>${logo ? `<img class="p-logo" src="${logo}" alt="">` : ""}<p class="p-title">Invoice</p></div>
        <div class="p-meta r"><b>${esc(inv.number)}</b><br>Issued ${esc(inv.date)}<br>Due ${esc(inv.due)}</div>
      </div>
      <div class="p-parties"><div><div class="p-label">From</div>${esc(inv.from)}</div><div><div class="p-label">Bill to</div>${esc(inv.to)}</div></div>
      <table><thead><tr><th>Description</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amount</th></tr></thead><tbody>
      ${inv.items.map(it => `<tr><td>${esc(it.d)}</td><td class="r">${+it.q || 0}</td><td class="r">${money(+it.r || 0)}</td><td class="r">${money((+it.q || 0) * (+it.r || 0))}</td></tr>`).join("")}
      </tbody></table>
      <div class="p-totals">
        <div><span>Subtotal</span><span>${money(sub)}</span></div>
        ${disc ? `<div><span>Discount (${+inv.discount}%)</span><span>−${money(disc)}</span></div>` : ""}
        ${tax ? `<div><span>Tax (${+inv.tax}%)</span><span>${money(tax)}</span></div>` : ""}
        <div class="grand"><span>Total due</span><span>${money(total)}</span></div>
      </div>
      ${inv.notes ? `<div class="p-notes"><div class="p-label">Notes</div>${esc(inv.notes)}</div>` : ""}
      ${pro ? "" : `<div class="p-wm">Made with InvoiceKit — free invoice generator</div>`}`;
    store.set("draft", inv);
  }

  f.addEventListener("input", e => {
    const t = e.target, row = t.closest(".item");
    if (row) inv.items[row.dataset.i][t.dataset.k] = t.value;
    else if (t.name) {
      if (t.name === "template" && !pro) { t.value = "classic"; return openPro(); }
      inv[t.name] = t.value;
      if (["from", "currency", "notes"].includes(t.name)) store.set(t.name, t.value);
    }
    render();
  });
  $("#items").addEventListener("click", e => {
    if (!e.target.classList.contains("x")) return;
    inv.items.splice(+e.target.parentNode.dataset.i, 1);
    if (!inv.items.length) inv.items.push({ d: "", q: 1, r: 0 });
    renderItems(); render();
  });
  $("#addItem").onclick = () => { inv.items.push({ d: "", q: 1, r: 0 }); renderItems(); render(); };

  // PDF via the browser's print dialog ("Save as PDF"); also files the invoice in history.
  $("#pdf").onclick = () => {
    const hist = store.get("history", []).filter(h => h.number !== inv.number);
    hist.unshift(structuredClone(inv)); store.set("history", hist.slice(0, 200));
    const n = parseInt(String(inv.number).replace(/\D/g, ""), 10);
    if (n > store.get("seq", 0)) store.set("seq", n);
    refreshLists();
    const t = document.title; document.title = inv.number; window.print(); document.title = t;
  };
  $("#new").onclick = () => load(blank());
  $("#dup").onclick = () => { if (!pro) return openPro(); load({ ...structuredClone(inv), number: nextNumber(), date: today(), due: today(14) }); };

  // Pro: logo, clients, history
  $("#logo").onchange = e => {
    if (!pro) { e.target.value = ""; return openPro(); }
    const file = e.target.files[0]; if (!file) return;
    const r = new FileReader(); r.onload = () => { store.set("logo", r.result); render(); }; r.readAsDataURL(file);
  };
  $("#saveClient").onclick = () => {
    if (!pro) return openPro();
    if (!inv.to.trim()) return;
    const c = store.get("clients", []); if (!c.includes(inv.to)) c.push(inv.to);
    store.set("clients", c); refreshLists();
  };
  $("#clients").onchange = e => { if (!pro) { e.target.value = ""; return openPro(); } if (e.target.value) { f.to.value = inv.to = e.target.value; render(); } };
  $("#history").onchange = e => {
    if (!pro) { e.target.value = ""; return openPro(); }
    const h = store.get("history", [])[+e.target.value]; if (h) load(h); e.target.value = "";
  };
  function refreshLists() {
    const c = $("#clients"); c.length = 1;
    if (pro) store.get("clients", []).forEach(v => c.add(new Option(v.split("\n")[0], v)));
    const h = $("#history"); h.length = 1;
    if (pro) store.get("history", []).forEach((v, i) => h.add(new Option(`${v.number} · ${(v.to || "").split("\n")[0]}`, i)));
  }

  // Licensing
  const dlg = $("#dlg");
  document.querySelectorAll(".js-buy").forEach(a => a.href = INVOICEKIT.checkoutUrl);
  document.querySelectorAll(".js-price").forEach(s => s.textContent = INVOICEKIT.price);
  function openPro() { if (!pro) dlg.showModal(); }
  $("#proBtn").onclick = openPro;
  $("#close").onclick = () => dlg.close();
  $("#activate").onclick = async () => {
    const key = $("#key").value.trim(); if (!key) return;
    $("#keyMsg").textContent = "Checking…";
    try {
      const r = await fetch("/api/verify", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key }) });
      const j = await r.json();
      if (j.ok) { pro = true; store.set("pro", true); store.set("key", key); dlg.close(); applyPro(); }
      else $("#keyMsg").textContent = "That key wasn't recognised. Check your purchase email.";
    } catch { $("#keyMsg").textContent = "Couldn't reach the server. Try again."; }
  };
  function applyPro() {
    $("#proBtn").style.display = pro ? "none" : "";
    $("#status").textContent = pro ? "Pro ✓" : "";
    document.querySelectorAll(".pro-tag").forEach(t => t.style.display = pro ? "none" : "");
    refreshLists(); render();
  }

  load(inv); applyPro();
})();
</script>
</body>
</html>
